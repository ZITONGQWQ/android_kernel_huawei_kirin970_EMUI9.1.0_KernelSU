name: Build Kirin970 KSU-v3.3.1 (backslashxx, 4.9)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      KERNEL_CMDLINE: "ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- O=out"
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 100

    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y binutils make libssl-dev flex unzip ca-certificates xz-utils \
          mkbootimg cpio device-tree-compiler git git-lfs bc bison build-essential ccache curl \
          g++-multilib gcc-multilib gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
          libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libxml2 libxml2-utils \
          lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev lib32ncurses6 || \
        sudo apt-get install -y binutils make libssl-dev flex unzip ca-certificates xz-utils \
          mkbootimg cpio device-tree-compiler git git-lfs bc bison build-essential ccache curl \
          g++-multilib gcc-multilib gnupg gperf imagemagick libelf-dev liblz4-tool ncurses-dev \
          libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
        sudo apt-get install -y python2 || sudo apt-get install -y python2-minimal || true
        make mrproper

    - name: GetTime
      id: get_time
      run: echo "TIME=$(TZ=UTC-8 date +%m%d%H%M)" >> $GITHUB_OUTPUT

    - name: Integrate backslashxx KernelSU
      run: |
        if [ -x /usr/bin/python2.7 ]; then sudo ln -sf /usr/bin/python2.7 /usr/bin/python; fi
        rm -rf include/config .git KernelSU drivers/kernelsu
        curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -s v3.3.1-50
        echo "--- drivers/kernelsu ---"
        ls -la drivers/kernelsu/ | head -30
        echo "--- gcc ---"
        ./aarch64-linux-android-4.9/bin/aarch64-linux-android-gcc --version | head -2

    - name: Patch defconfig
      run: |
        DC=arch/arm64/configs/Ravel_kirin970_KSU_defconfig
        sed -i '/^CONFIG_KSU_DEBUG=y/d' $DC
        grep -q '^CONFIG_KSU=y' $DC || echo 'CONFIG_KSU=y' >> $DC
        echo 'CONFIG_KSU_TAMPER_SYSCALL_TABLE=y' >> $DC
        echo 'CONFIG_KSU_LSM_SECURITY_HOOKS=y' >> $DC
        echo 'CONFIG_KSU_FEATURE_ADBROOT=y' >> $DC
        echo 'CONFIG_KSU_SHELL_HAS_SU_ALWAYS=y' >> $DC
        echo '--- perf: BBR / FQ / FQ_CODEL / ZSTD / KSM ---'
        sed -i 's/^# CONFIG_TCP_CONG_BBR is not set/CONFIG_TCP_CONG_BBR=y/' $DC
        grep -q '^CONFIG_TCP_CONG_BBR=y' $DC || echo 'CONFIG_TCP_CONG_BBR=y' >> $DC
        sed -i 's/^# CONFIG_DEFAULT_BBR is not set/CONFIG_DEFAULT_BBR=y/' $DC
        sed -i 's/^CONFIG_DEFAULT_CUBIC=y/# CONFIG_DEFAULT_CUBIC is not set/' $DC
        grep -q '^CONFIG_DEFAULT_BBR=y' $DC || echo 'CONFIG_DEFAULT_BBR=y' >> $DC
        sed -i 's/^CONFIG_DEFAULT_TCP_CONG=.*/CONFIG_DEFAULT_TCP_CONG="bbr"/' $DC
        sed -i 's/^# CONFIG_NET_SCH_FQ is not set/CONFIG_NET_SCH_FQ=y/' $DC
        grep -q '^CONFIG_NET_SCH_FQ=y' $DC || echo 'CONFIG_NET_SCH_FQ=y' >> $DC
        sed -i 's/^# CONFIG_NET_SCH_FQ_CODEL is not set/CONFIG_NET_SCH_FQ_CODEL=y/' $DC
        grep -q '^CONFIG_NET_SCH_FQ_CODEL=y' $DC || echo 'CONFIG_NET_SCH_FQ_CODEL=y' >> $DC
        sed -i 's/^# CONFIG_CRYPTO_ZSTD is not set/CONFIG_CRYPTO_ZSTD=y/' $DC
        grep -q '^CONFIG_CRYPTO_ZSTD=y' $DC || echo 'CONFIG_CRYPTO_ZSTD=y' >> $DC
        grep -q '^CONFIG_KSM=y' $DC || echo 'CONFIG_KSM=y' >> $DC

          # ---- Android 12+ kernel capability (BPF JIT / device cgroup) ----
          sed -i 's/^# CONFIG_BPF_JIT is not set/CONFIG_BPF_JIT=y/' $DC
          grep -q '^CONFIG_BPF_JIT=y' $DC || echo 'CONFIG_BPF_JIT=y' >> $DC
          sed -i 's/^# CONFIG_CGROUP_DEVICE is not set/CONFIG_CGROUP_DEVICE=y/' $DC
          grep -q '^CONFIG_CGROUP_DEVICE=y' $DC || echo 'CONFIG_CGROUP_DEVICE=y' >> $DC
          sed -i 's/^# CONFIG_BPF_JIT_ALWAYS_ON is not set/CONFIG_BPF_JIT_ALWAYS_ON=y/' $DC
          grep -E 'BPF_JIT|CGROUP_DEVICE|CGROUP_BPF' $DC
        echo '--- verify ---'
        grep -E 'TCP_CONG_BBR|DEFAULT_TCP_CONG|NET_SCH_FQ|CRYPTO_ZSTD|^CONFIG_KSM' $DC
        tail -12 $DC

    - name: Strip legacy KSU 0.9.5 hook call sites
      run: |
        python3 - <<'PYEOF'
        import re
        targets = ['fs/exec.c','fs/open.c','fs/read_write.c','fs/stat.c','drivers/input/input.c']
        comment = re.compile(r'/\*\n\* Add KernelSU symbol\n\*/\n')
        calls = [
         (r'\tif \(unlikely\(ksu_execveat_hook\)\)\n\t\tksu_handle_execveat\([^;]*\);\n\telse\n\t\tksu_handle_execveat_sucompat\([^;]*\);\n', 'execveat'),
         (r'\n\tksu_handle_faccessat\([^;]*\);\n', 'faccessat'),
         (r'\tif \(unlikely\(ksu_vfs_read_hook\)\)\n\t\tksu_handle_vfs_read\([^;]*\);\n\n', 'vfs_read'),
         (r'\tksu_handle_stat\([^;]*\);\n', 'stat'),
         (r'\tif \(unlikely\(ksu_input_hook\)\)\n\t\tksu_handle_input_handle_event\([^;]*\);\n\n', 'input'),
        ]
        for f in targets:
            s = open(f).read()
            s, _ = comment.subn('', s)
            lines = s.split('\n')
            out, i, removed = [], 0, 0
            while i < len(lines):
                ln = lines[i]
                if ln.lstrip().startswith('extern') and 'ksu_' in ln:
                    removed += 1
                    while i < len(lines) and ');' not in lines[i]:
                        i += 1
                    i += 1
                    continue
                out.append(ln); i += 1
            s = '\n'.join(out)
            for pat, name in calls:
                s, n = re.subn(pat, '', s, count=1)
                removed += n
            open(f, 'w').write(s)
            print('patched', f, 'removed', removed)
        left = 0
        for f in targets:
            if 'ksu_' in open(f).read():
                print('LEFTOVER in', f); left += 1
        assert left == 0, 'legacy ksu_ references still present'
        print('--- all legacy ksu_ call sites stripped ---')
        PYEOF
    - name: Patch KSU sepolicy for Huawei 4.9 policydb layout
      run: |
        python3 - <<'PYEOF'
        p = 'drivers/kernelsu/selinux/sepolicy.c'
        s = open(p).read()
        pairs = [
          ('#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 4, 0) || defined(KSU_TYPE_VAL_TO_STRUCT)\n',
           '#if (LINUX_VERSION_CODE >= KERNEL_VERSION(5, 4, 0) || defined(KSU_TYPE_VAL_TO_STRUCT)) && !defined(CONFIG_IS_HW_HISI)\n'),
          ('#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0) || defined(KSU_TYPE_VAL_TO_STRUCT) || defined(KSU_TYPE_VAL_TO_STRUCT_ARRAY)\n',
           '#if (LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0) || defined(KSU_TYPE_VAL_TO_STRUCT) || defined(KSU_TYPE_VAL_TO_STRUCT_ARRAY)) && !defined(CONFIG_IS_HW_HISI)\n'),
        ]
        for old, new in pairs:
            assert old in s, 'pattern not found: ' + old
            s = s.replace(old, new, 1)
            print('patched:', old.strip())
        open(p, 'w').write(s)
        print('--- result ---')
        for i, line in enumerate(s.split('\n'), 1):
            if 'CONFIG_IS_HW_HISI' in line and line.startswith('#'):
                print(i, line)
        PYEOF
    - name: Backport cgroup device BPF (BPF_PROG_TYPE_CGROUP_DEVICE)
      run: |
        set -e
        python3 .github/scripts/ksu_devcg_patch.py
        echo "--- verification: symbols present ---"
        grep -c "BPF_PROG_TYPE_CGROUP_DEVICE" include/uapi/linux/bpf.h
        grep -n "__cgroup_bpf_check_dev_permission" include/linux/bpf-cgroup.h kernel/bpf/cgroup.c | head
        grep -n "BPF_CGROUP_RUN_PROG_DEVICE_CGROUP" include/linux/bpf-cgroup.h security/device_cgroup.c | head
        grep -n "case BPF_CGROUP_DEVICE" kernel/bpf/syscall.c
        grep -n "cg_dev_verifier_ops" kernel/bpf/cgroup.c

    - name: Build Kernel
      run: |
        export PATH=$(pwd)/aarch64-linux-android-4.9/bin/:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        make $KERNEL_CMDLINE HOSTCFLAGS="-fcommon -w" Ravel_kirin970_KSU_defconfig
        grep -E 'CONFIG_KSU|CONFIG_SECCOMP=|CONFIG_SECURITY_SELINUX=' out/.config | sort
        make $KERNEL_CMDLINE HOSTCFLAGS="-fcommon -w" -j$(nproc --all)

    - name: Pack boot image
      run: |
        CMDLINE="loglevel=4 initcall_debug=n page_tracker=on unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0xfff0a000,0x534,0x538 androidboot.selinux=enforcing buildvariant=user maxcpus=8 androidboot.mgtest=PERF4"
        tools/mkbootimg --kernel out/arch/arm64/boot/Image.gz --base 0x0 \
          --cmdline "$CMDLINE" \
          --tags_offset 0x07A00000 --kernel_offset 0x00080000 --ramdisk_offset 0x07C00000 \
          --header_version 1 --os_version 9 --os_patch_level 2020-01-01 \
          --output Kirin970_Ravel_KSU_PERF4-${{ steps.get_time.outputs.TIME }}.img
        ls -l *.img

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Kirin970_Ravel_KSU_PERF4-${{ steps.get_time.outputs.TIME }}
        path: "Kirin970_Ravel_KSU_PERF4-*.img"